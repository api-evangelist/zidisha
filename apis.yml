name: Zidisha
description: >-
  Zidisha is a nonprofit direct person-to-person microlending and crowdfunding
  platform that connects funders in wealthier countries directly with
  low-income entrepreneurs in developing countries, with no local intermediary
  taking a cut. Founded in 2009 and backed by Y Combinator, Zidisha lets
  entrepreneurs apply for funding, communicate directly with their backers,
  post updates, and repay at zero interest so that funds recycle into new
  projects. The platform focuses on agriculture, retail, transportation, and
  small-business growth across regions including Kenya, Indonesia, Burkina
  Faso, and beyond. Zidisha operates as a consumer-facing web platform and
  does not currently publish a public developer API, SDK, or integration
  surface; this profile tracks its public web presence in the API Evangelist
  network.
